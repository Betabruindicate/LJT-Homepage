name: Pages Status Check
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Query Pages and homepage
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          curl -sS -H "Authorization: Bearer ${TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" | head -c 2000
          echo
          curl -sS -H "Authorization: Bearer ${TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest" | head -c 2000
          echo
          curl -sS -L --max-time 30 -o /tmp/home.html -w 'HOME_HTTP:%{http_code} BYTES:%{size_download}\n' "https://betabruindicate.github.io/LJT-Homepage/"
          grep -o '<title>[^<]*</title>' /tmp/home.html | head -1
