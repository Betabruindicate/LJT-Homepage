name: Pages API probe
on:
  workflow_dispatch:
permissions: write-all
jobs:
  configure-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Update Pages build type
        run: |
          set +e
          API="https://api.github.com/repos/${{ github.repository }}/pages"
          AUTH="Authorization: Bearer ${{ github.token }}"
          echo '--- PUT WORKFLOW ---'
          curl -sS -w '\nHTTP_STATUS:%{http_code}\n' -X PUT -H "$AUTH" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$API" -d '{"build_type":"workflow"}'
          echo '--- GET ---'
          curl -sS -H "$AUTH" -H 'Accept: application/vnd.github+json' "$API" | jq '{status,build_type,source,html_url}'
