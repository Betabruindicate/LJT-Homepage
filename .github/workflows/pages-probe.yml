name: Pages API probe
on:
  workflow_dispatch:
permissions: write-all
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Concise Pages status
        run: |
          set +e
          API="https://api.github.com/repos/${{ github.repository }}/pages"
          AUTH="Authorization: Bearer ${{ github.token }}"
          HDR='Accept: application/vnd.github+json'
          echo '--- PAGE ---'
          curl -sS -H "$AUTH" -H "$HDR" "$API" | jq '{status,html_url,build_type,source}'
          echo '--- LATEST ---'
          curl -sS -H "$AUTH" -H "$HDR" "$API/builds/latest" | jq '{status,error,commit,created_at,updated_at,duration}'
          echo '--- FAILED BUILD ---'
          curl -sS -H "$AUTH" -H "$HDR" "$API/builds/1394169130" | jq '.'
          echo '--- HOME STATUS ---'
          curl -sS -o /tmp/home.html -w 'HTTP:%{http_code} BYTES:%{size_download}\n' -L 'https://betabruindicate.github.io/LJT-Homepage/'
          grep -o '<title>[^<]*</title>' /tmp/home.html | head -1
