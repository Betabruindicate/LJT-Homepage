name: Pages API probe
on:
  workflow_dispatch:
permissions: write-all
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Pages build diagnostics
        run: |
          set +e
          AUTH="Authorization: Bearer ${{ github.token }}"
          BASE="https://api.github.com/repos/${{ github.repository }}/pages"
          echo '--- PAGE ---'
          curl -sS -w '\nHTTP_STATUS:%{http_code}\n' -H "$AUTH" -H 'Accept: application/vnd.github+json' "$BASE"
          echo '--- LATEST BUILD ---'
          curl -sS -w '\nHTTP_STATUS:%{http_code}\n' -H "$AUTH" -H 'Accept: application/vnd.github+json' "$BASE/builds/latest"
          echo '--- BUILDS ---'
          curl -sS -w '\nHTTP_STATUS:%{http_code}\n' -H "$AUTH" -H 'Accept: application/vnd.github+json' "$BASE/builds?per_page=5"
          echo '--- REQUEST BUILD ---'
          curl -sS -w '\nHTTP_STATUS:%{http_code}\n' -X POST -H "$AUTH" -H 'Accept: application/vnd.github+json' "$BASE/builds"
          sleep 20
          echo '--- LATEST BUILD AFTER REQUEST ---'
          curl -sS -w '\nHTTP_STATUS:%{http_code}\n' -H "$AUTH" -H 'Accept: application/vnd.github+json' "$BASE/builds/latest"
          echo '--- PUBLIC HOME ---'
          curl -sS -I -L --max-time 25 'https://betabruindicate.github.io/LJT-Homepage/'
          echo '--- PUBLIC INDEX HTML ---'
          curl -sS -L --max-time 25 'https://betabruindicate.github.io/LJT-Homepage/index.html' | head -c 500
